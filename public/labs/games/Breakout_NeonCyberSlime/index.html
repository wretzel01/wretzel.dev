<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Neon Cyber-Slime</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: black;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <canvas id="game"></canvas>

    <script type="module">
        import { GameController } from "./src/game.js";

        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        new GameController(canvas, ctx);
    </script>

</body>
</html>
